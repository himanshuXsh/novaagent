version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: novaagent
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: novaagent
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
